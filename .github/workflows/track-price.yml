name: Track Prices

on:
  workflow_dispatch:
    inputs:
      add_product_json:
        description: 'Optional JSON of a new product to add to tracking'
        required: false
        type: string

permissions:
  contents: read

env:
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
  ADD_PRODUCT_JSON: ${{ inputs.add_product_json }}

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore price history and products from cache
        id: history-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            *.csv
            products.json
          key: sitewatch-data-${{ github.run_id }}
          restore-keys: |
            sitewatch-data-

      - name: Install Python deps
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Record prices & stock
        id: price
        run: python3 price_tracker.py

      - name: Save price history and products to cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            *.csv
            products.json
          key: sitewatch-data-${{ github.run_id }}
